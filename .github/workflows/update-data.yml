name: Update NFL Data

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-data.yml"
  schedule:
    # nflverse current-season PBP updates around 09:00 UTC. This runs afterward.
    - cron: "30 10 * * *"

permissions:
  contents: write

concurrency:
  group: nfl-data-refresh
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build current matchup data
        run: python scripts/build_matchups_v2.py

      - name: Add moneyline win probabilities
        run: python scripts/enrich_market.py

      - name: Add team and player matchup history
        run: python scripts/enrich_history.py

      - name: Add current NFL player props
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: python scripts/enrich_props.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/matchups.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh NFL matchup data"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi

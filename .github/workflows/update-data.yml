name: Update NFL Data

on:
  workflow_dispatch:
  schedule:
    # nflverse current-season PBP updates around 09:00 UTC. This runs afterward.
    - cron: "30 10 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nfl-data-refresh
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build current matchup data
        run: python scripts/build_matchups.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/matchups.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh NFL matchup data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
